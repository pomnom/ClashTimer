name: Build APK

# Upload ClashTimer.zip ke repo → workflow mengekstrak isinya ke repo (README, kode, dll ikut
# terbarui), menghapus zip-nya, lalu membuat APK di halaman Releases.
# Tanpa zip (mis. README diedit langsung di GitHub), APK dibuat dari kode yang ada di repo.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Riwayat & tag lengkap: catatan rilis dibandingkan dengan rilis sebelumnya.
          fetch-depth: 0

      - name: Ekstrak ClashTimer.zip ke repo
        run: |
          if [ ! -f ClashTimer.zip ]; then
            echo "Tidak ada ClashTimer.zip — memakai kode yang sudah ada di repo."
            exit 0
          fi
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q ClashTimer.zip -d /tmp/src
          SRC=/tmp/src
          [ -d /tmp/src/ClashTimer ] && SRC=/tmp/src/ClashTimer
          # Samakan isi repo dengan isi zip (file yang dihapus dari zip ikut terhapus).
          # Folder .github tidak disentuh: token Actions tidak boleh mengubah file workflow.
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'ClashTimer.zip' \
            "$SRC"/ ./
          rm -f ClashTimer.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Isi zip sama dengan repo."
          else
            git commit -q -m "Ekstrak ClashTimer.zip (build ${{ github.run_number }})"
            git push origin "HEAD:${{ github.ref_name }}" || echo "Push dilewati: ada commit baru, run berikutnya yang memperbarui repo."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kunci tanda tangan dari Secrets
        env:
          CT_KEYSTORE_B64: ${{ secrets.CT_KEYSTORE_B64 }}
        run: |
          test -n "$CT_KEYSTORE_B64" || { echo "::error::Secret CT_KEYSTORE_B64 belum diisi"; exit 1; }
          echo "$CT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clashtimer.keystore"
          echo "CT_KEYSTORE_FILE=$RUNNER_TEMP/clashtimer.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          CT_STORE_PASSWORD: ${{ secrets.CT_STORE_PASSWORD }}
          CT_KEY_PASSWORD: ${{ secrets.CT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ClashTimer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashTimer-apk
          path: ClashTimer.apk

      # Catatan rilis dari app/src/main/assets/changelog.txt ("# judul" + "- butir").
      # Bila file itu tidak berubah sejak rilis sebelumnya, cukup satu baris umum.
      - name: Catatan rilis
        run: |
          NOTES=app/src/main/assets/changelog.txt
          PREV=$(git tag --list 'build-*' --sort=-v:refname | head -n 1)
          if [ -f "$NOTES" ] && { [ -z "$PREV" ] || ! git diff --quiet "$PREV" -- "$NOTES"; }; then
            sed -e 's/^# \(.*\)/### \1/' "$NOTES" > RELEASE_NOTES.md
          else
            echo "- Perbaikan kecil." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # Juga dipasang di halaman Releases supaya gampang diunduh dari HP; isi rilis = catatan di atas
      # (tampil di kartu update aplikasi).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clash Timer build ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: ClashTimer.apk
          make_latest: true
