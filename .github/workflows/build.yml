name: Build APK

# Upload ClashTimer.zip ke repo → workflow mengekstrak isinya ke repo (README, kode, dll ikut
# terbarui), menghapus zip-nya, lalu membuat APK di halaman Releases.
# Tanpa zip (mis. README diedit langsung di GitHub), APK dibuat dari kode yang ada di repo.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ekstrak ClashTimer.zip ke repo
        run: |
          if [ ! -f ClashTimer.zip ]; then
            echo "Tidak ada ClashTimer.zip — memakai kode yang sudah ada di repo."
            exit 0
          fi
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q ClashTimer.zip -d /tmp/src
          SRC=/tmp/src
          [ -d /tmp/src/ClashTimer ] && SRC=/tmp/src/ClashTimer
          # Samakan isi repo dengan isi zip (file yang dihapus dari zip ikut terhapus).
          # Folder .github tidak disentuh: token Actions tidak boleh mengubah file workflow.
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'ClashTimer.zip' \
            "$SRC"/ ./
          rm -f ClashTimer.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Isi zip sama dengan repo."
          else
            git commit -q -m "Ekstrak ClashTimer.zip (build ${{ github.run_number }})"
            git push origin "HEAD:${{ github.ref_name }}" || echo "Push dilewati: ada commit baru, run berikutnya yang memperbarui repo."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ClashTimer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashTimer-apk
          path: ClashTimer.apk

      # Juga dipasang di halaman Releases supaya gampang diunduh dari HP.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clash Timer build ${{ github.run_number }}
          files: ClashTimer.apk
          make_latest: true
